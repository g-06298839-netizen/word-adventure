<!DOCTYPE html>

<html lang="en">

<head>

```
<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Word Adventure</title>

<link rel="stylesheet" href="style.css">
```

</head>

<body>

<!-- =========================
     CARTOON BACKGROUND
========================= -->

<div class="sun">
    ☀️
</div>

<div class="cloud cloud1">
    ☁️
</div>

<div class="cloud cloud2">
    ☁️
</div>

<div class="butterfly">
    🦋
</div>

<div class="balloon balloon1">
    🎈
</div>

<div class="balloon balloon2">
    🎈
</div>

<!-- =========================
        HOME PAGE
========================= -->

<section id="homePage">

```
<h1>
    🌈 Word Adventure 🌈
</h1>

<h2>
    Choose your adventure!
</h2>

<div class="map">

    <button id="level1Btn" class="levelButton">

        ⭐ Level 1

    </button>


    <button id="level2Btn" class="levelButton locked" disabled>

        🔒 Level 2

    </button>

</div>
```

</section>

<!-- =========================
        GAME PAGE
========================= -->

<section id="gamePage" class="hidden">

```
<div class="gameBox">


    <h1 id="levelTitle">

        Level 1

    </h1>


    <!-- QUESTION NUMBER -->

    <div id="progress">

        Question 1 / 10

    </div>


    <!-- PROGRESS BAR -->

    <div class="progressContainer">

        <div id="progressBar"></div>

    </div>


    <div id="score">

        ⭐ Score: 0

    </div>


    <div id="lives">

        ❤️ ❤️ ❤️

    </div>


    <img
        id="picture"
        src=""
        alt="vocabulary picture"
    >


    <p id="definition">

        Definition

    </p>


    <p id="hint">

        Hint

    </p>


    <!-- AUDIO BUTTON -->

    <div class="listen-area">

    <button id="listenBtn">
        🔊 Listen
    </button>

    <p class="listen-reminder">
        💡 Try to guess the word first!
        <br>
        🔊 Listen only when you really need help.
    </p>

</div>


    <!-- AUDIO REMINDER -->



    <br>


    <input
        id="answer"
        type="text"
        placeholder="Type your answer here"
        autocomplete="off"
    >


    <br>


    <button id="submitBtn">

        Submit ⭐

    </button>


    <p id="message">

    </p>


    <button id="backBtn">

        🏠 Back to Map

    </button>


</div>
```

</section>

<!-- =========================
       SIDE TREES
========================= -->

<div class="trees">

```
<span>
    🌳 🌳
</span>

<span>
    🌳 🌳
</span>
```

</div>

<!-- =========================
       FLOWERS
========================= -->

<div class="flowers">

```
🌼 🌸 🌼 🌸 🌼 🌸
```

</div>

<script src="script.js"></script>

</body>

</html>
